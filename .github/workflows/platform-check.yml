name: Platform checks
on:
  push:
    paths-ignore: ['axp-tracker/**']
  pull_request:
    paths-ignore: ['axp-tracker/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: aws-actions/setup-sam@v2
      - run: sam validate --lint --template-file infra/template.yaml --region us-west-2
      - run: sam build --template-file infra/template.yaml
        env:
          AWS_DEFAULT_REGION: us-west-2
          SAM_CLI_TELEMETRY: '0'
